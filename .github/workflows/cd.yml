name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy to k3s (helm)
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Деплой в k3s через Helm
        run: |
          bash scripts/deploy-k3s.sh