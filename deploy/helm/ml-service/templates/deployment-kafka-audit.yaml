apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-kafka-audit
  namespace: {{ .Values.namespace }}
  labels:
    app: ml-service
    component: kafka-audit
spec:
  replicas: {{ .Values.kafkaAudit.replicas }}
  selector:
    matchLabels:
      app: ml-service
      component: kafka-audit
  template:
    metadata:
      labels:
        app: ml-service
        component: kafka-audit
    spec:
      containers:
        - name: kafka-audit
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "apps/ml-service/kafka_audit.py"]
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secret
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 200m, memory: 256Mi }