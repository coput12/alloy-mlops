global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: ml-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ml-service:8000"]

  - job_name: ml-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["ml-worker:8000"]

  - job_name: kafka-audit
    metrics_path: /metrics
    static_configs:
      - targets: ["kafka-audit:8000"]