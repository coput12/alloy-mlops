# GitLab CI: зеркало CI-пайплайна из GitHub Actions.
# Подключите GitLab Runner (Docker executor), в CI/CD settings ->
# Variables включите CI_REGISTRY_USER/CI_REGISTRY_PASSWORD (обычно автогенерируются).

stages:
  - lint
  - test
  - build

image: python:3.12

lint:
  stage: lint
  script:
    - pip install ruff
    - ruff check apps/ml-service ml

test:
  stage: test
  script:
    - pip install pytest pandas numpy scikit-learn
    - cd apps/ml-service
    - MODEL_PATH=../../models/model_rf.pkl pytest -q

build:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  only:
    - main
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:latest" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"